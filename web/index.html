<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">
  <script>
    // EMR used to address screens after a '#' (/emr/#/emrDesktop). It now
    // uses real paths (/emr/patients) — see usePathUrlStrategy() in
    // lib/main.dart — so turn an old link or bookmark into its path form
    // before Flutter reads the URL. The router then sends any old route name
    // to the right page.
    (function () {
      var hash = location.hash;
      if (hash.indexOf('#/') !== 0) return;
      var base = new URL(document.baseURI).pathname; // e.g. "/emr/"
      var route = hash.slice(2); // e.g. "emrDesktop"
      if (route.indexOf('?') === -1) route += location.search;
      history.replaceState(null, '', base + route);
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EMR">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EMR</title>
  <script>
    // Same rule as lib/app/services/title/app_title.dart, applied before
    // Flutter boots so the tab is right while the app loads.
    (function () {
      var host = location.hostname, suffix = '.symmetry.care';
      var tenant = host.slice(0, -suffix.length);
      var name = host.endsWith(suffix) && tenant && tenant.indexOf('.') === -1
        ? tenant.charAt(0).toUpperCase() + tenant.slice(1)
        : host;
      document.title = 'EMR | ' + name;
    })();
  </script>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Maps JavaScript API.

    google_maps_flutter_web is a thin wrapper over this script: it reads
    `window.google.maps` while building the GoogleMap widget and throws
    "Cannot read properties of undefined (reading 'maps')" if the script has
    not run yet. So it is loaded synchronously here, *before*
    flutter_bootstrap.js, rather than with async/defer — deferring it turns the
    dependency into a race that only fails on slower connections.

    symmetry-hr has no map screens, which is why its index.html omits this.
    EMR renders maps on the dashboard, the Calendar tab's route map and the
    address pickers, so it needs the loader.

    The key is the same public browser key the deployed app already uses; a
    Maps browser key is necessarily visible to the client and is restricted by
    HTTP referrer on the Google Cloud side, not by secrecy.
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCw6mXOPCtbKn5i0bWcAcnfXCkb0y5G7Lg"></script>
</head>
<body>
  <!--
    PDF.js, for the same reason: pdfx's web implementation calls into
    `globalThis.pdfjsLib` (the patient chart and profile preview referral,
    insurance and protocol documents via PdfDocument.openData), and without
    this it fails at open time.
  -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs" type="module"></script>
  <script type="module">
    var { pdfjsLib } = globalThis;
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
